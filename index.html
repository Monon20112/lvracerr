    <style>
        body { background-color: #1a1a1a; text-align: center; font-family: sans-serif; color: white; margin: 0; overflow: hidden; }
        #game-container { position: relative; width: 300px; margin: 10px auto; }
        canvas { background: #2c3e50; border: 4px solid #34495e; display: block; border-radius: 12px; image-rendering: pixelated; width: 300px; height: 450px; }
        .controls { margin-top: 15px; display: flex; justify-content: center; gap: 15px; }
        button { padding: 20px 40px; font-size: 22px; font-weight: bold; background: #3498db; color: white; border: none; border-radius: 12px; touch-action: manipulation; cursor: pointer; }
        #menuOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; z-index: 10; }
        .mode-btn { width: 85%; margin: 8px 0; padding: 15px; border-radius: 8px; border: none; color: white; font-weight: bold; cursor: pointer; font-size: 16px;}
    </style>
</head>
<body>
    <h3 style="margin: 10px 0;">LV HIGHWAY RACER</h3>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="menuOverlay">
            <h2 id="msg" style="color:#f1c40f;">READY?</h2>
            <p id="scoreDisplay">Score: 1p / sec</p>
            <p id="highScoreText" style="color: #2ecc71; margin-bottom: 10px;">BEST: 0</p>
            <button class="mode-btn" style="background:#2ecc71" onclick="startGame(1)">SLOW</button>
            <button class="mode-btn" style="background:#f39c12" onclick="startGame(3)">HARD</button>
            <button class="mode-btn" style="background:#e74c3c" onclick="startGame(5)">SUPER HARD</button>
        </div>
    </div>
    <div class="controls"><button id="leftBtn">◀</button><button id="rightBtn">▶</button></div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menuOverlay');
        canvas.width = 150; canvas.height = 225;

        let score = 0, level = 1, speed = 0, gameActive = false, roadOffset = 0, lastScoreTime = 0;
        let highScore = parseInt(localStorage.getItem('lvRacerHigh')) || 0;
        document.getElementById('highScoreText').innerText = "BEST: " + highScore;

        const lanes = [30, 75, 120]; 
        let player = { laneIndex: 1, x: lanes[1], y: 170, targetX: lanes[1] };
        let enemy = { x: lanes[0], y: -80, color: "#7b241c" };
        const enemyColors = ["#7b241c", "#1f618d", "#1e8449", "#707b7c", "#884ea0"];

        const carMatrix = [[0,0,0,3,3,3,3,3,3,0,0,0],[0,0,3,1,1,2,2,1,1,3,0,0],[0,4,3,1,1,2,2,1,1,3,4,0],[3,3,3,1,1,2,2,1,1,3,3,3],[3,3,3,5,5,5,5,5,5,3,3,3],[3,3,3,1,1,1,1,1,1,3,3,3],[0,3,3,1,1,2,2,1,1,3,3,0],[0,0,3,1,1,2,2,1,1,3,0,0],[0,0,3,1,1,2,2,1,1,3,0,0],[0,0,3,1,1,2,2,1,1,3,0,0],[3,3,3,1,1,1,1,1,1,3,3,3],[3,3,3,1,1,2,2,1,1,3,3,3],[3,3,3,1,1,2,2,1,1,3,3,3],[0,3,3,1,1,2,2,1,1,3,3,0],[0,0,0,3,1,1,1,1,3,0,0,0]];

        function drawPixelCar(x, y, isPlayer, eColor) {
            const pSize = 1.6; const startX = x - (12 * pSize) / 2;
            for (let r = 0; r < carMatrix.length; r++) {
                for (let c = 0; c < carMatrix[r].length; c++) {
                    const val = carMatrix[r][c]; if (val === 0) continue;
                    if (val === 1) ctx.fillStyle = isPlayer ? "#333" : eColor; 
                    if (val === 2) ctx.fillStyle = isPlayer ? "#f1c40f" : "#ecf0f1"; 
                    if (val === 3) ctx.fillStyle = "#111"; if (val === 4) ctx.fillStyle = "#fff"; 
                    if (val === 5) ctx.fillStyle = isPlayer ? "#555" : "#222"; 
                    ctx.fillRect(startX + (c * pSize), y + (r * pSize), pSize, pSize);
                }
            }
        }

        window.startGame = function(s) {
            score = 0; level = 1; speed = s; gameActive = true;
            player.laneIndex = 1; player.x = lanes[1]; player.targetX = lanes[1];
            enemy.y = -100; enemy.x = lanes[Math.floor(Math.random() * 3)];
            lastScoreTime = Date.now(); menu.style.display = "none";
        };

        document.getElementById('leftBtn').onclick = () => { if(player.laneIndex > 0) player.targetX = lanes[--player.laneIndex]; };
        document.getElementById('rightBtn').onclick = () => { if(player.laneIndex < 2) player.targetX = lanes[++player.laneIndex]; };

        function loop() {
            ctx.fillStyle = "#34495e"; ctx.fillRect(0,0,150,225); 
            ctx.fillStyle = "#27ae60"; ctx.fillRect(0,0,8,225); ctx.fillRect(142,0,8,225); 
            ctx.fillStyle = "#fff"; roadOffset = (roadOffset + speed) % 20;
            for(let i=-20; i<225; i+=20) { ctx.fillRect(52, i + roadOffset, 1, 10); ctx.fillRect(97, i + roadOffset, 1, 10); }
            if(gameActive) {
                if (Date.now() - lastScoreTime >= 1000) { score++; lastScoreTime = Date.now(); if (score % 10 === 0) { level++; speed += 0.5; } }
                player.x += (player.targetX - player.x) * 0.2; enemy.y += speed;
                if(enemy.y > 225) { enemy.y = -100; enemy.x = lanes[Math.floor(Math.random() * 3)]; enemy.color = enemyColors[Math.floor(Math.random() * enemyColors.length)]; }
                if(Math.abs(player.x - enemy.x) < 20 && Math.abs(player.y - enemy.y) < 30) {
                    gameActive = false; if(score > highScore) { highScore = score; localStorage.setItem('lvRacerHigh', highScore); }
                    document.getElementById('msg').innerText = "CRASHED!"; document.getElementById('scoreDisplay').innerText = "Score: " + score;
                    document.getElementById('highScoreText').innerText = "BEST: " + highScore; menu.style.display = "flex";
                }
            }
            drawPixelCar(player.x, player.y, true); drawPixelCar(enemy.x, enemy.y, false, enemy.color); 
            ctx.fillStyle = "white"; ctx.font = "bold 10px Arial"; ctx.fillText("SCORE: " + score, 15, 18); ctx.fillText("LVL: " + level, 15, 30);
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
