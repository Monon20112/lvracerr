<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/BumblebeeIcon/Game/main/icon.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/BumblebeeIcon/Game/main/icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LV Highway Racer</title>
    <style>
        body { background-color: #1a1a1a; text-align: center; font-family: 'Courier New', Courier, monospace; color: white; margin: 0; overflow: hidden; }
        #game-container { position: relative; width: 300px; margin: 10px auto; }
        canvas { 
            background: #2c3e50; 
            border: 5px solid #34495e; 
            display: block; 
            margin: 10px auto; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 4px;
            image-rendering: pixelated;
        }
        .controls { margin-top: 10px; display: flex; justify-content: center; gap: 20px; }
        button { 
            padding: 15px 30px; font-size: 16px; font-weight: bold; font-family: inherit;
            background: #3498db; color: white; border: none; border-radius: 4px;
            touch-action: manipulation; cursor: pointer;
            box-shadow: 0 4px #2980b9;
        }
        button:active { box-shadow: 0 0 #2980b9; transform: translateY(2px); }
        #menuOverlay {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 10px;
            width: 80%;
        }
    </style>
</head>
<body>
    <h3 style="margin: 10px 0;">LV HIGHWAY RACER</h3>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="menuOverlay">
            <h2 id="msg" style="color:#f1c40f;">READY?</h2>
            <p id="scoreDisplay">Score: 0p | sec</p>
            <p id="highScoreText" style="color: #2ecc71; margin-bottom: 10px;">BEST: 0</p>
            <button onclick="startGame(1)">SLOW</button>
            <button onclick="startGame(3)">HARD</button>
            <button onclick="startGame(5)">SUPER HARD</button>
        </div>
    </div>
    <div class="controls">
        <button id="leftBtn">◀</button>
        <button id="rightBtn">▶</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menuOverlay');
        canvas.width = 150; canvas.height = 225;

        let score = 0, level = 1, speed = 0, gameActive = false, roadOffset = 0, lastScoreTime = 0;
        let highScore = parseInt(localStorage.getItem('lvRacerHigh')) || 0;
        document.getElementById('highScoreText').innerText = "BEST: " + highScore;

        const lanes = [30, 75, 120];
        let player = { laneIndex: 1, x: lanes[1], y: 170, targetX: lanes[1] };
        let enemy = { x: lanes[0], y: -80, color: "#7b241c" };
        const enemyColors = ["#7b241c", "#1f618d", "#1e8449", "#707b7c", "#b84ea0"];

        const carMatrix = [[0,0,3,3,3,3,0,0],[0,3,1,1,2,2,1,1,3,0],[0,4,3,1,1,2,2,1,1,3,4,0],[3,3,3,1,1,2,2,1,1,3,3,3]];

        function drawPixelCar(x, y, isPlayer, eColor) {
            const pSize = 1.6; const startX = x - (12 * pSize) / 2;
            for (let r = 0; r < carMatrix.length; r++) {
                for (let c = 0; c < carMatrix[r].length; c++) {
                    const val = carMatrix[r][c]; if (val === 0) continue;
                    if (val === 1) ctx.fillStyle = isPlayer ? "#333" : eColor;
                    if (val === 2) ctx.fillStyle = isPlayer ? "#f1c40f" : "#ecf0f1";
                    if (val === 3) ctx.fillStyle = "#111"; if (val === 4) ctx.fillStyle = "#fff";
                    if (val === 5) ctx.fillStyle = isPlayer ? "#555" : "#222";
                    ctx.fillRect(startX + (c * pSize), y + (r * pSize), pSize, pSize);
                }
            }
        }

        window.startGame = function(s) {
            score = 0; level = 1; speed = s; gameActive = true;
            player.laneIndex = 1; player.x = lanes[1]; player.targetX = lanes[1];
            enemy.y = -100; enemy.x = lanes[Math.floor(Math.random() * 3)];
            lastScoreTime = Date.now(); menu.style.display = "none";
        };

        document.getElementById('leftBtn').onclick = () => { if (player.laneIndex > 0) player.targetX = lanes[--player.laneIndex]; };
        document.getElementById('rightBtn').onclick = () => { if (player.laneIndex < 2) player.targetX = lanes[++player.laneIndex]; };

        function loop() {
            ctx.fillStyle = "#34495e"; ctx.fillRect(0,0,150,225);
            ctx.fillStyle = "#27ae60"; ctx.fillRect(0,0,8,225); ctx.fillRect(142,0,8,225);
            ctx.fillStyle = "#fff"; roadOffset = (roadOffset + speed) % 20;
            for(let i=-20; i<225; i+=20) { ctx.fillRect(52, i + roadOffset, 1, 10); ctx.fillRect(97, i + roadOffset, 1, 10); }
            if(gameActive) {
                if (Date.now() - lastScoreTime >= 1000) { score++; lastScoreTime = Date.now(); if (score % 10 === 0) speed += 0.5; }
                player.x += (player.targetX - player.x) * 0.2; enemy.y += speed;
                if(enemy.y > 225) { enemy.y = -100; enemy.x = lanes[Math.floor(Math.random() * 3)]; enemy.color = enemyColors[Math.floor(Math.random()*5)]; }
                if(Math.abs(player.x - enemy.x) < 20 && Math.abs(player.y - enemy.y) < 30) {
                    gameActive = false; menu.style.display = "block"; document.getElementById('msg').innerText = "CRASHED!";
                    if(score > highScore) { highScore = score; localStorage.setItem('lvRacerHigh', highScore); }
                    document.getElementById('highScoreText').innerText = "BEST: " + highScore;
                }
            } else { menu.style.display = "block"; }
            drawPixelCar(player.x, player.y, true); drawPixelCar(enemy.x, enemy.y, false, enemy.color);
            document.getElementById('scoreDisplay').innerText = `Score: ${score}p | ${speed.toFixed(1)}s`;
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
